<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cities - Weather Across India</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-window">
    
    <!-- Left Sidebar -->

          </svg>
          <span>Cities</span>
        </a>
        <a href="map.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <line x1="15" y1="6" x2="15" y2="21"></line>
          </svg>
          <span>Map</span>
        </a>
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>

            <line x1="17" y1="16" x2="23" y2="16"></line>

    </aside>

    <!-- Center Content -->
    <main class="main-content" style="flex: 1; padding: 10px; display: flex; flex-direction: column;">
      
      <!-- Search Bar -->
      <div class="search-container">
        <input type="text" id="city-search-input" placeholder="Search for cities">
        <div id="search-dropdown" class="search-dropdown" style="display:none;">
          <ul id="search-results-list"></ul>
        </div>
      </div>

      <h2 style="font-size: 24px; font-weight: 700; margin-bottom: 24px; color: var(--text-main);">Weather Across India</h2>
      
      <div id="cities-grid" class="cities-grid">
        <!-- Filled by JS -->
      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cities.js"></script>
</body>
</html>
