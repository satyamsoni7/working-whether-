<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Main App Window -->
  <div class="app-window">
    
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
        </svg>
      </div>
      
      <nav class="nav-menu">
        <a href="index.html" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19C19.433 19 21 17.433 21 15.5C21 13.75 19.7 12.25 18 12.05C17.5 9.25 15 7 12 7C9.25 7 6.9 8.95 6.2 11.6C4.4 11.8 3 13.25 3 15C3 16.933 4.567 18.5 6.5 18.5H17.5Z"/>
            <path d="M12 2V4M12 20V22M4.93 4.93L6.34 6.34M17.66 17.66L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.34 17.66M17.66 6.34L19.07 4.93"/>
          </svg>
          <span>Weather</span>
        </a>
        <a href="cities.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>Cities</span>
        </a>
        <a href="map.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
            <line x1="9" y1="3" x2="9" y2="18"></line>
            <line x1="15" y1="6" x2="15" y2="21"></line>
          </svg>
          <span>Map</span>
        </a>
        <a href="settings.html" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span>Settings</span>
        </a>
      </nav>
    </aside>

    <!-- Center Content -->
    <main class="main-content">
      
      <!-- Search Bar -->
      <div class="search-container" style="display: flex; gap: 10px;">
        <div style="position: relative; flex: 1;">
          <input type="text" id="city-search-input" placeholder="Search for cities">
          <div id="search-dropdown" class="search-dropdown" style="display:none;">
            <ul id="search-results-list"></ul>
          </div>
        </div>
        <button id="locate-me-btn" title="Detect my location" style="background: var(--bg-card); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-md); width: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s;">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
          </svg>
        </button>
      </div>

      <!-- Current Weather Hero -->
      <div class="current-weather">
        <div class="current-text">
          <h1 id="city-name">Madrid</h1>
          <p class="chance-rain">Chance of rain: <span id="chance-of-rain-val">0%</span></p>
          <div class="temp">
            <span id="current-temp">31</span><span class="degree">°</span>
          </div>
        </div>
        <div class="current-graphic" id="hero-icon-container">
          <!-- Animated Sun SVG -->
        </div>
      </div>

      <!-- Today's Forecast -->
      <div class="card today-forecast">
        <div class="card-title">TODAY'S FORECAST</div>
        <div class="hourly-list" id="hourly-forecast-list">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Air Conditions -->
      <div class="card air-conditions">
        <div class="card-header">
          <div class="card-title">AIR CONDITIONS</div>
          <button class="btn-primary">See more</button>
        </div>
        <div class="conditions-grid">
          
          <div class="cond-item">
            <div class="cond-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>
              </svg> 
              Real Feel
            </div>
            <div class="cond-value"><span id="feels-like-temp">30</span>°</div>
          </div>
          
          <div class="cond-item">
            <div class="cond-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
              </svg> 
              Wind
            </div>
            <div class="cond-value"><span id="wind-speed">0.2</span> <span class="unit">km/h</span></div>
          </div>
          
          <div class="cond-item">
            <div class="cond-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
              </svg> 
              Chance of rain
            </div>
            <div class="cond-value"><span id="chance-of-rain-val-2">0</span>%</div>
          </div>
          
          <div class="cond-item">
            <div class="cond-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
              </svg> 
              UV Index
            </div>
            <div class="cond-value" id="uv-index-val">3</div>
          </div>

        </div>
      </div>

    </main>

    <!-- Right Sidebar (7-Day Forecast) -->
    <aside class="right-sidebar card">
      <div class="card-title">7-DAY FORECAST</div>
      <div class="weekly-list" id="weekly-forecast-list">
        <!-- Filled by JS -->
      </div>
    </aside>

  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
